<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register for Southern Fireflies Retreat</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/register.css" />
</head>
<body class="register-page">
  <div class="background-wrapper">
    <img src="images/green modern spring sale (Flyer).png" alt="Retreat Flyer" class="background-image" />
    <div class="form-container">
      <h2>Retreat Registration</h2>

      <div class="qr-code">
        <img src="images/venmo.png" alt="@SouthernFirefliesRetreats" />
        <a href="https://venmo.com/SouthernFirefliesRetreats">Scan QR code or click here to pay via Venmo</a>
      </div>

      <!-- Use .btn class for consistency -->
      <a href="cancellation.html" class="btn">View Our Policies</a>

      <form action="register.php" method="POST">
        <input type="text" name="name" placeholder="Full Name" required />
        <input type="text" name="address" placeholder="Home Address" required />
        <input type="tel" name="phone" placeholder="Phone Number" required />
        <input type="email" name="email" placeholder="Email Address" required />
        <textarea name="message" placeholder="Special Requests or Notes" rows="3"></textarea>
        <button type="submit" class="btn">Submit Registration</button>
      </form>
    </div>
  </div>
</body>
</html>
